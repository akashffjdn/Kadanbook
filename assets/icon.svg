<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    KadanBook app icon source — 1024×1024.
    The shopkeeper's tally: four vertical strokes + diagonal slash = "5".
    Export to icon.png at the same dimensions.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B00" />
      <stop offset="1" stop-color="#FF8C38" />
    </linearGradient>
  </defs>

  <!-- Full-bleed tile (iOS applies its own mask; Android adaptive uses background separately) -->
  <rect width="1024" height="1024" fill="url(#brand)" />

  <!-- Tally strokes — 10.24× of the 100-unit design (stroke 82, x = 287/430/574/717, y 266→717) -->
  <g stroke="#FFFFFF" stroke-width="82" stroke-linecap="round" fill="none">
    <line x1="287"  y1="266" x2="287"  y2="717" />
    <line x1="430"  y1="266" x2="430"  y2="717" />
    <line x1="574"  y1="266" x2="574"  y2="717" />
    <line x1="717"  y1="266" x2="717"  y2="717" />
    <line x1="225"  y1="717" x2="799"  y2="266" />
  </g>
</svg>
