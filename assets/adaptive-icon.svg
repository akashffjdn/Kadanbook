<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Android adaptive icon foreground — 1024×1024.
    Mark is centered inside the inner safe zone (~66% of canvas).
    Background (#000000) is set in app.json → android.adaptiveIcon.backgroundColor.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B00" />
      <stop offset="1" stop-color="#FF8C38" />
    </linearGradient>
  </defs>

  <!-- 500×500 mark centered with 130px continuous corners — sits inside Android's adaptive safe zone -->
  <g transform="translate(262, 262)">
    <rect width="500" height="500" rx="130" ry="130" fill="url(#brand)" />
    <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none">
      <line x1="140" y1="130" x2="140" y2="350" />
      <line x1="210" y1="130" x2="210" y2="350" />
      <line x1="280" y1="130" x2="280" y2="350" />
      <line x1="350" y1="130" x2="350" y2="350" />
      <line x1="110" y1="350" x2="390" y2="130" />
    </g>
  </g>
</svg>
